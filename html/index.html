<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="skin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ============ STATUS FRAME (bars around the minimap) ============ -->
    <div id="status-frame" class="status-frame">
        <div class="status-circle sf-bar sf-top" data-key="stamina">
            <div class="bar-track"><div class="bar-fill"></div></div>
            <span class="sf-lbl">STAMINA</span>
        </div>
        <div class="status-circle sf-bar sf-bottom" data-key="health">
            <div class="bar-track"><div class="bar-fill"></div></div>
            <span class="sf-lbl">HEALTH</span>
        </div>
        <div class="status-circle sf-bar sf-left" data-key="hunger">
            <div class="bar-track"><div class="bar-fill"></div></div>
            <span class="sf-lbl">HUNGER</span>
        </div>
        <div class="status-circle sf-bar sf-right" data-key="thirst">
            <div class="bar-track"><div class="bar-fill"></div></div>
            <span class="sf-lbl">THIRST</span>
        </div>
    </div>

    <!-- ============ MINIMAP GHOST ============
         Only visible in "Edit layout" mode. The minimap is a game
         element, so it cannot be dragged inside the NUI; instead its
         rectangle is represented by this box, which is dragged. client.lua converts
         the drop position via SetMinimapComponentPosition and moves the real
         radar there. -->
    <div id="mmghost" class="mm-ghost" data-movable>
        <span data-i18n="minimapLabel">MINIMAP</span>
    </div>

    <!-- ============ STATUS (bottom left) - pill style ============ -->
    <div id="status" class="status-wrap">
        <!-- Microphone - square frame ported from Toxic HUD.
                  While talking the frame and icon take Toxic HUD's main color (--accent). -->
        <div class="status-circle voice" data-key="voice" id="sc-voice" data-movable>
            <svg class="voice-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="11" rx="3"/>
                <path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/>
            </svg>
            <div class="voice-range" id="voice-range">2</div>
        </div>

        <div class="pill-col">
        <div class="status-circle pill" data-key="health" id="sc-health" data-movable>
            <div class="bar-track"><div class="bar-fill"><div class="pill-face on-fill"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1z"/><path d="M3.5 12.5h4l1.5-2 2 4 2-3h6"/></svg><span>HEALTH</span></div></div></div>
            <div class="pill-face on-track"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1z"/><path d="M3.5 12.5h4l1.5-2 2 4 2-3h6"/></svg><span>HEALTH</span></div>
        </div>
        <div class="status-circle pill mini" data-key="hunger" id="sc-hunger" data-movable>
            <div class="bar-track"><div class="bar-fill"></div></div>
            <div class="pill-face on-track"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a2.5 2.5 0 0 0 5 0V3"/><path d="M8.5 10v11"/><path d="M17.5 3c-1.4 0-2.5 2.2-2.5 5s1.1 4 2.5 4V3z"/><path d="M17.5 12v9"/></svg><span>HUNGER</span></div>
        </div>
        <!-- Stamina - small pill identical to hunger / thirst -->
        <div class="status-circle pill mini" data-key="stamina" id="sc-stamina" data-movable style="display:none">
            <div class="bar-track"><div class="bar-fill"></div></div>
            <div class="pill-face on-track"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg><span>STAMINA</span></div>
        </div>
        <!-- Lung capacity - time left to breathe underwater. Only visible underwater
                  (or until the lungs have recovered). -->
        <div class="status-circle pill mini" data-key="lung" id="sc-lung" data-movable style="display:none">
            <div class="bar-track"><div class="bar-fill"></div></div>
            <div class="pill-face on-track"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="15" r="4.5"/><circle cx="16.5" cy="7.5" r="2.5"/><circle cx="17" cy="16.5" r="1.5"/></svg><span>LUNG</span></div>
        </div>
        </div>

        <div class="pill-col">
        <div class="status-circle pill" data-key="armor" id="sc-armor" data-movable>
            <div class="bar-track"><div class="bar-fill"><div class="pill-face on-fill"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"/></svg><span>ARMOR</span></div></div></div>
            <div class="pill-face on-track"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"/></svg><span>ARMOR</span></div>
        </div>
        <div class="status-circle pill mini" data-key="thirst" id="sc-thirst" data-movable>
            <div class="bar-track"><div class="bar-fill"></div></div>
            <div class="pill-face on-track"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.3 6 10a6 6 0 0 1-12 0c0-3.7 6-10 6-10z"/></svg><span>THIRST</span></div>
        </div>
        <!-- Stress - small pill identical to hunger / thirst / stamina.
                  The value is driven by toxic_hud's stress system (client/stress.lua +
                  server/stress.lua). -->
        <div class="status-circle pill mini" data-key="stress" id="sc-stress" data-movable style="display:none">
            <div class="bar-track"><div class="bar-fill"></div></div>
            <div class="pill-face on-track"><svg class="pill-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5a2.5 2.5 0 0 0-2.5 2.5v.6A3 3 0 0 0 5 8.4a3 3 0 0 0 .5 1.7A3 3 0 0 0 5 14a3 3 0 0 0 2 2.8v1a2.5 2.5 0 0 0 5 0V5a2.5 2.5 0 0 0-2.5-2.5z"/><path d="M14.5 2.5A2.5 2.5 0 0 1 17 5v.6a3 3 0 0 1 2 2.8 3 3 0 0 1-.5 1.7A3 3 0 0 1 19 14a3 3 0 0 1-2 2.8v1a2.5 2.5 0 0 1-5 0"/></svg><span>STRESS</span></div>
        </div>
        </div>
    </div>

    <!-- ============ INFO CARD (top left) ============ -->
    <div id="info" class="info-wrap" data-movable>
        <div class="info-row">
            <div class="info-chip"><span class="dot"></span><span id="info-id">#1</span></div>
            <div class="info-chip"><svg class="mini" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.6 4 2.3-1 1.7-5-2.9V6h2v6.6z"/></svg><span id="info-time">00:00</span></div>
        </div>
        <div class="info-row">
            <div class="info-chip wide"><svg class="mini" viewBox="0 0 24 24"><path d="M10 2h4l1 2h4a1 1 0 0 1 1 1v3H4V5a1 1 0 0 1 1-1h4l1-2zM4 9h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9z"/></svg><span id="info-job">Job</span></div>
            <div class="info-chip cash"><svg class="mini" viewBox="0 0 24 24"><path d="M3 6h18v12H3V6zm9 2.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5z"/></svg><span id="info-cash">$0</span></div>
        </div>
        <div class="info-row grade-row">
            <div class="info-chip grade"><span id="info-grade"></span></div>
        </div>
        <div class="info-row">
            <div class="info-chip bank wide"><svg class="mini" viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7L12 2zM4 10v8H3v3h18v-3h-1v-8h-2v8h-3v-8h-2v8h-2v-8H9v8H6v-8H4z"/></svg><span id="info-bank">$0</span></div>
        </div>
    </div>

    <!-- ============ STREET / COMPASS (top center) ============ -->
    <div id="street" class="street-wrap" data-movable>
        <div class="street-side left" id="street-left">—</div>
        <div class="street-center">
            <div class="street-heading">
                <span id="street-dir">N</span>
                <span id="street-deg">0°</span>
            </div>
            <div class="street-name" id="street-name">—</div>
        </div>
        <div class="street-side right" id="street-right">—</div>
    </div>

    <!-- ============ SPEEDOMETER (bottom right) ============ -->
    <!-- ============ VEHICLE HUD (bottom right) ============
              Toxic HUD's vehicle card. Previously there were 7 separate styles (petrol /
              diesel / ev / bike / moto / heli / air), inside which the ENG bar was
              absolutely positioned and overlapped. All of them are replaced by
              one simple card: speed + unit + gear, speed bar,
              fuel / engine percentage.

              The class names (.sp-speed / .sp-unit / .sp-gear / .sp-fuel) are the same as
              the old hooks, so script.js's setAll() keeps
              working. -->
    <div id="speedo" class="speedo-wrap is-hidden" data-movable data-style="toxic">
        <div class="sp sp-toxic">
            <div class="speed-row">
                <span class="speed sp-speed">0</span>
                <span class="speed-unit sp-unit">KMH</span>
                <span class="gear sp-gear">N</span>
            </div>
            <div class="speed-bar"><span class="sp-speed-bar"></span></div>
            <div class="card-stats">
                <span class="stat sp-stat-fuel">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 22h11V3a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M3 10h11"/><path d="M17 8l3 3v8a1.5 1.5 0 0 1-3 0v-6"/></svg>
                    <strong class="sp-fuel">100</strong>FUEL
                </span>
                <span class="stat sp-stat-eng">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4.5a5 5 0 0 1-6.6 6.6L5 20.5a2.1 2.1 0 0 1-3-3l9.4-9.4A5 5 0 0 1 18 1.5z"/></svg>
                    <strong class="sp-eng">100</strong>ENGINE
                </span>
            </div>
        </div>
    </div>

    <!-- ============ HUD EDITOR / SETTINGS ============ -->
    <div id="hud-editor" class="hud-editor">

        <!-- ===== Settings panel ===== -->
        <div class="editor-panel" id="settings-panel">
            <div class="editor-logo">TOXIC<span>HUD</span></div>
            <div class="editor-title" data-i18n="title">Settings</div>

            <div class="setting-group">
                <div class="setting-label" data-i18n="statusLayout">Status HUD</div>
                <div class="seg" id="status-seg">
                    <button data-status="frame" data-i18n="layoutFrame">Minimap frame</button>
                    <button data-status="rings" data-i18n="layoutRings">Rings</button>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label" data-i18n="speedUnit">Speed unit</div>
                <div class="seg" id="unit-seg">
                    <button data-unit="mph">MPH</button>
                    <button data-unit="kmh">KMH</button>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label" data-i18n="hudSize">HUD size</div>
                <div class="scale-row">
                    <input type="range" id="scale-range" min="0.7" max="1.5" step="0.05" value="1">
                    <span class="scale-val" id="scale-val">100%</span>
                    <button class="scale-reset" id="scale-reset" data-i18n="hudAuto" title="Auto">Auto</button>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label" data-i18n="language">Language</div>
                <div class="lang-seg" id="lang-seg">
                    <button data-lang="en">English</button>
                    <button data-lang="ru">Русский</button>
                    <button data-lang="zh">中文</button>
                    <button data-lang="ko">한국어</button>
                    <button data-lang="fr">Français</button>
                    <button data-lang="mn">Монгол</button>
                </div>
            </div>

            <div class="editor-buttons">
                <button id="btn-move" class="editor-btn" data-i18n="editPos">⤢ Edit layout</button>
                <button id="editor-reset" class="editor-btn" data-i18n="reset">↺ Reset</button>
                <button id="editor-close" class="editor-btn primary" data-i18n="close">✓ Close</button>
            </div>
            <div class="editor-foot" data-i18n="escClose">Press ESC to close</div>
        </div>

        <!-- ===== Drag mode bar ===== -->
        <div class="drag-bar" id="drag-bar">
            <span data-i18n="dragHint">Drag elements with your <b>mouse</b></span>
            <button id="drag-done" class="editor-btn primary" data-i18n="dragDone">✓ Done</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
